workflows:

  # ─────────────────────────────────────────────
  # WORKFLOW 1 : APK de prévisualisation (rapide)
  # ─────────────────────────────────────────────
  android-preview:
    name: Android APK Preview
    max_build_duration: 60
    environment:
      node: 18.17.0
      java: 17
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Install Expo CLI + EAS CLI
        script: npm install -g expo-cli eas-cli

      - name: Generate native Android project
        script: npx expo prebuild --platform android --clean

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Make gradlew executable
        script: chmod +x android/gradlew

      - name: Build debug APK (no signing required)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # WORKFLOW 2 : APK/AAB signé (production)
  # Nécessite un keystore configuré dans Codemagic
  # ─────────────────────────────────────────────
  android-release:
    name: Android Release (Signed)
    max_build_duration: 90
    environment:
      node: 18.17.0
      java: 17
      android_signing:
        - uauben_keystore   # À créer dans Codemagic → Code signing
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Install Expo CLI
        script: npm install -g expo-cli

      - name: Generate native Android project
        script: npx expo prebuild --platform android --clean

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Make gradlew executable
        script: chmod +x android/gradlew

      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
